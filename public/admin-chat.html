<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Support Chat — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  body { background: #fafafa; color: #222; margin: 0; }
  #login-screen { max-width: 340px; margin: 80px auto; padding: 24px; background: #fff; border: 1px solid #e5e0da; border-radius: 12px; }
  #login-screen h1 { font-size: 18px; color: #b5451b; margin: 0 0 14px; }
  #login-screen input { width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
  #login-screen button, #toggle-btn { background: #d9631f; color: #fff; border: none; padding: 10px 14px; border-radius: 7px; font-weight: 600; cursor: pointer; }
  #login-err { color: #b5451b; font-size: 13px; min-height: 16px; }

  #app { display: none; height: 100vh; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #b5451b; color: #fff;
  }
  #topbar h1 { font-size: 16px; margin: 0; }
  #status-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #main { display: flex; height: calc(100vh - 50px); }
  #thread-list { width: 260px; border-right: 1px solid #e5e0da; overflow-y: auto; background: #fff; }
  .thread-item { padding: 12px 14px; border-bottom: 1px solid #f0ece6; cursor: pointer; font-size: 13px; }
  .thread-item:hover { background: #faf7f4; }
  .thread-item.active { background: #fbe9de; }
  .thread-item .name { font-weight: 600; }
  .thread-item .time { color: #999; font-size: 11px; }
  #chat-area { flex: 1; display: flex; flex-direction: column; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #faf7f4; }
  .msg { margin: 6px 0; max-width: 60%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; font-size: 13.5px; }
  .msg.visitor { background: #eee; color: #222; margin-right: auto; border-bottom-left-radius: 2px; }
  .msg.admin { background: #d9631f; color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
  #reply-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e0da; background: #fff; }
  #reply-input { flex: 1; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  #reply-send { background: #d9631f; color: #fff; border: none; border-radius: 6px; padding: 0 16px; cursor: pointer; font-weight: 600; }
  #empty-state { padding: 40px; text-align: center; color: #999; font-size: 13px; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #cc8a6a; transition: .2s; border-radius: 22px; }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .2s; border-radius: 50%; }
  input:checked + .slider { background: #3fa34d; }
  input:checked + .slider:before { transform: translateX(18px); }
</style>
</head>
<body>
  <div id="login-screen">
    <h1>Support Chat — Admin</h1>
    <input id="pw-input" type="password" placeholder="Admin password">
    <div id="login-err"></div>
    <button id="login-btn">Log in</button>
  </div>

  <div id="app">
    <div id="topbar">
      <h1>TTD Darshan Autofill — Support Chat</h1>
      <div id="status-row">
        <span id="status-label">Offline</span>
        <label class="switch">
          <input type="checkbox" id="online-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div id="main">
      <div id="thread-list"></div>
      <div id="chat-area">
        <div id="chat-messages"><div id="empty-state">Select a conversation on the left.</div></div>
        <form id="reply-form" style="display:none;">
          <input id="reply-input" type="text" placeholder="Type a reply…" autocomplete="off">
          <button id="reply-send" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "";
    let adminPassword = sessionStorage.getItem("ttd_admin_pw") || "";
    let activeThreadId = null;
    let lastMessageAt = null;
    let threadsTimer = null;
    let messagesTimer = null;

    function authHeaders() {
      return { "Content-Type": "application/json", "x-admin-password": adminPassword };
    }

    async function tryLogin(pw) {
      const res = await fetch(`${API_BASE}/api/chat-admin?action=threads`, { headers: { "x-admin-password": pw } });
      return res.ok;
    }

    document.getElementById("login-btn").addEventListener("click", async () => {
      const pw = document.getElementById("pw-input").value;
      const ok = await tryLogin(pw);
      if (!ok) {
        document.getElementById("login-err").textContent = "Wrong password.";
        return;
      }
      adminPassword = pw;
      sessionStorage.setItem("ttd_admin_pw", pw);
      showApp();
    });

    function showApp() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadStatus();
      loadThreads();
      threadsTimer = setInterval(loadThreads, 6000);
    }

    async function loadStatus() {
      const res = await fetch(`${API_BASE}/api/chat-status`);
      const data = await res.json();
      document.getElementById("online-toggle").checked = !!data.online;
      document.getElementById("status-label").textContent = data.online ? "Online" : "Offline";
    }

    document.getElementById("online-toggle").addEventListener("change", async (e) => {
      const online = e.target.checked;
      await fetch(`${API_BASE}/api/chat-admin?action=toggle`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ online })
      });
      document.getElementById("status-label").textContent = online ? "Online" : "Offline";
    });

    async function loadThreads() {
      const res = await fetch(`${API_BASE}/api/chat-admin?action=threads`, { headers: { "x-admin-password": adminPassword } });
      if (!res.ok) return;
      const data = await res.json();
      const list = document.getElementById("thread-list");
      list.innerHTML = "";
      (data.threads || []).forEach(t => {
        const item = document.createElement("div");
        item.className = "thread-item" + (t.id === activeThreadId ? " active" : "");
        item.innerHTML = `<div class="name">${t.visitor_name || t.visitor_email}</div><div class="time">${new Date(t.last_message_at).toLocaleString()}</div>`;
        item.addEventListener("click", () => openThread(t.id));
        list.appendChild(item);
      });
    }

    function openThread(threadId) {
      activeThreadId = threadId;
      lastMessageAt = null;
      document.getElementById("reply-form").style.display = "flex";
      document.getElementById("chat-messages").innerHTML = "";
      loadMessages();
      clearInterval(messagesTimer);
      messagesTimer = setInterval(loadMessages, 4000);
      loadThreads();
    }

    async function loadMessages() {
      if (!activeThreadId) return;
      const res = await fetch(`${API_BASE}/api/chat-admin?action=messages&threadId=${encodeURIComponent(activeThreadId)}`, {
        headers: { "x-admin-password": adminPassword }
      });
      if (!res.ok) return;
      const data = await res.json();
      const box = document.getElementById("chat-messages");
      box.innerHTML = "";
      (data.messages || []).forEach(m => {
        const el = document.createElement("div");
        el.className = "msg " + m.sender;
        el.textContent = m.message;
        box.appendChild(el);
        lastMessageAt = m.created_at;
      });
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById("reply-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("reply-input");
      const text = input.value.trim();
      if (!text || !activeThreadId) return;
      input.value = "";
      await fetch(`${API_BASE}/api/chat-admin?action=reply`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ threadId: activeThreadId, message: text })
      });
      loadMessages();
    });

    if (adminPassword) {
      tryLogin(adminPassword).then(ok => { if (ok) showApp(); });
    }
  </script>
</body>
</html>
