<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Support Chat — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  body { background: #fafafa; color: #222; margin: 0; }
  #login-screen { max-width: 340px; margin: 80px auto; padding: 24px; background: #fff; border: 1px solid #e5e0da; border-radius: 12px; }
  #login-screen h1 { font-size: 18px; color: #b5451b; margin: 0 0 14px; }
  #login-screen input { width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
  #login-screen button, #toggle-btn { background: #d9631f; color: #fff; border: none; padding: 10px 14px; border-radius: 7px; font-weight: 600; cursor: pointer; }
  #login-err { color: #b5451b; font-size: 13px; min-height: 16px; }

  #app { display: none; height: 100vh; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #b5451b; color: #fff;
  }
  #topbar h1 { font-size: 16px; margin: 0; }
  #status-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #main { display: flex; height: calc(100vh - 50px); }
  #thread-list { width: 260px; border-right: 1px solid #e5e0da; overflow-y: auto; background: #fff; }
  .thread-item { padding: 12px 14px; border-bottom: 1px solid #f0ece6; cursor: pointer; font-size: 13px; }
  .thread-item:hover { background: #faf7f4; }
  .thread-item.active { background: #fbe9de; }
  .thread-item .name { font-weight: 600; }
  .thread-item .time { color: #999; font-size: 11px; }
  #chat-area { flex: 1; display: flex; flex-direction: column; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #faf7f4; }
  .msg-row { display: flex; flex-direction: column; margin: 6px 0; max-width: 60%; }
  .msg-row.visitor { margin-right: auto; align-items: flex-start; }
  .msg-row.admin, .msg-row.bot { margin-left: auto; align-items: flex-end; }
  .msg { padding: 8px 12px; border-radius: 10px; line-height: 1.4; font-size: 13.5px; }
  .msg.visitor { background: #eee; color: #222; border-bottom-left-radius: 2px; }
  .msg.admin { background: #d9631f; color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot { background: #fff3e0; color: #7a4a17; border: 1px dashed #e0b273; border-bottom-right-radius: 2px; }
  .msg-time { font-size: 10.5px; color: #999; margin: 2px 6px 0; }
  .msg-tag { font-size: 10px; color: #b5451b; font-weight: 700; text-transform: uppercase; margin: 0 6px; letter-spacing: 0.3px; }
  .presence-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 5px; flex-shrink: 0; }
  .presence-dot.online { background: #3fa34d; }
  .thread-item { position: relative; }
  .thread-item .name-row { display: flex; align-items: center; }
  .thread-item .meta-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .status-pill { font-size: 10px; padding: 2px 6px; border-radius: 10px; text-transform: uppercase; font-weight: 700; }
  .status-pill.open { background: #e6f4ea; color: #3fa34d; }
  .status-pill.closed { background: #f0ece6; color: #999; }
  .category-pill { font-size: 10px; padding: 2px 6px; border-radius: 10px; background: #fbe9de; color: #b5451b; }
  #thread-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #e5e0da; background: #fff; font-size: 13px; }
  #thread-header select { font-size: 12px; padding: 4px 6px; border-radius: 6px; border: 1px solid #ddd; }
  #thread-header-name { font-weight: 600; display: flex; align-items: center; }
  #reply-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e0da; background: #fff; }
  #reply-input { flex: 1; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  #reply-send { background: #d9631f; color: #fff; border: none; border-radius: 6px; padding: 0 16px; cursor: pointer; font-weight: 600; }
  #reply-send:disabled { opacity: 0.6; cursor: default; }
  #reply-attach { background: #eee; color: #555; border: none; border-radius: 6px; width: 40px; cursor: pointer; font-size: 15px; }
  #reply-attach:disabled { opacity: 0.6; cursor: default; }
  .msg-img { max-width: 260px; border-radius: 8px; display: block; cursor: pointer; }
  #empty-state { padding: 40px; text-align: center; color: #999; font-size: 13px; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #cc8a6a; transition: .2s; border-radius: 22px; }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .2s; border-radius: 50%; }
  input:checked + .slider { background: #3fa34d; }
  input:checked + .slider:before { transform: translateX(18px); }
</style>
</head>
<body>
  <div id="login-screen">
    <h1>Support Chat — Admin</h1>
    <input id="pw-input" type="password" placeholder="Admin password">
    <div id="login-err"></div>
    <button id="login-btn">Log in</button>
  </div>

  <div id="app">
    <div id="topbar">
      <h1>TTD Darshan Autofill — Support Chat</h1>
      <div id="status-row">
        <span id="status-label">Offline</span>
        <label class="switch">
          <input type="checkbox" id="online-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div id="main">
      <div id="thread-list"></div>
      <div id="chat-area">
        <div id="thread-header" style="display:none;">
          <div id="thread-header-name"></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <select id="category-select"></select>
            <select id="status-select">
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
        <div id="chat-messages"><div id="empty-state">Select a conversation on the left.</div></div>
        <form id="reply-form" style="display:none;">
          <button id="reply-attach" type="button" title="Attach a screenshot">📎</button>
          <input id="reply-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
          <input id="reply-input" type="text" placeholder="Type a reply…" autocomplete="off">
          <button id="reply-send" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "";
    let adminPassword = sessionStorage.getItem("ttd_admin_pw") || "";
    let activeThreadId = null;
    let lastMessageAt = null;
    let threadsTimer = null;
    let messagesTimer = null;
    let knownCategories = [];
    let threadsById = {};

    function fmtTime(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString();
    }

    function authHeaders() {
      return { "Content-Type": "application/json", "x-admin-password": adminPassword };
    }

    async function tryLogin(pw) {
      const res = await fetch(`${API_BASE}/api/chat-admin?action=threads`, { headers: { "x-admin-password": pw } });
      return res.ok;
    }

    document.getElementById("login-btn").addEventListener("click", async () => {
      const pw = document.getElementById("pw-input").value;
      const ok = await tryLogin(pw);
      if (!ok) {
        document.getElementById("login-err").textContent = "Wrong password.";
        return;
      }
      adminPassword = pw;
      sessionStorage.setItem("ttd_admin_pw", pw);
      showApp();
    });

    function showApp() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadStatus();
      loadThreads();
      threadsTimer = setInterval(loadThreads, 6000);
    }

    async function loadStatus() {
      const res = await fetch(`${API_BASE}/api/chat-status`);
      const data = await res.json();
      document.getElementById("online-toggle").checked = !!data.online;
      document.getElementById("status-label").textContent = data.online ? "Online" : "Offline";
    }

    document.getElementById("online-toggle").addEventListener("change", async (e) => {
      const online = e.target.checked;
      await fetch(`${API_BASE}/api/chat-admin?action=toggle`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ online })
      });
      document.getElementById("status-label").textContent = online ? "Online" : "Offline";
    });

    async function loadThreads() {
      const res = await fetch(`${API_BASE}/api/chat-admin?action=threads`, { headers: { "x-admin-password": adminPassword } });
      if (!res.ok) return;
      const data = await res.json();
      if (data.categories) knownCategories = data.categories;
      const list = document.getElementById("thread-list");
      list.innerHTML = "";
      threadsById = {};
      (data.threads || []).forEach(t => {
        threadsById[t.id] = t;
        const item = document.createElement("div");
        item.className = "thread-item" + (t.id === activeThreadId ? " active" : "");
        item.innerHTML = `
          <div class="name-row"><span class="presence-dot${t.online ? " online" : ""}" title="${t.online ? "Online now" : "Offline"}"></span><span class="name">${t.visitor_name || t.visitor_email}</span></div>
          <div class="time">${fmtTime(t.last_message_at)}</div>
          <div class="meta-row">
            <span class="status-pill ${t.status}">${t.status}</span>
            ${t.category ? `<span class="category-pill">${t.category}</span>` : ""}
          </div>`;
        item.addEventListener("click", () => openThread(t.id));
        list.appendChild(item);
      });
      // Keep the header controls in sync if the active thread's own row changed
      // (e.g. auto-closed by the cron, or reopened by a new visitor message).
      if (activeThreadId && threadsById[activeThreadId]) updateThreadHeader(threadsById[activeThreadId]);
    }

    function populateCategorySelect() {
      const sel = document.getElementById("category-select");
      sel.innerHTML = `<option value="">(no category)</option>` +
        knownCategories.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function updateThreadHeader(t) {
      document.getElementById("thread-header").style.display = "flex";
      document.getElementById("thread-header-name").innerHTML =
        `<span class="presence-dot${t.online ? " online" : ""}"></span>${t.visitor_name || t.visitor_email}`;
      if (!document.getElementById("category-select").options.length) populateCategorySelect();
      document.getElementById("category-select").value = t.category || "";
      document.getElementById("status-select").value = t.status || "open";
    }

    function openThread(threadId) {
      activeThreadId = threadId;
      lastMessageAt = null;
      document.getElementById("reply-form").style.display = "flex";
      document.getElementById("chat-messages").innerHTML = "";
      if (threadsById[threadId]) updateThreadHeader(threadsById[threadId]);
      loadMessages();
      clearInterval(messagesTimer);
      messagesTimer = setInterval(loadMessages, 4000);
      loadThreads();
    }

    document.getElementById("category-select").addEventListener("change", async (e) => {
      if (!activeThreadId) return;
      await fetch(`${API_BASE}/api/chat-admin?action=classify`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ threadId: activeThreadId, category: e.target.value })
      });
      loadThreads();
    });

    document.getElementById("status-select").addEventListener("change", async (e) => {
      if (!activeThreadId) return;
      await fetch(`${API_BASE}/api/chat-admin?action=status`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ threadId: activeThreadId, status: e.target.value })
      });
      loadThreads();
    });

    async function loadMessages() {
      if (!activeThreadId) return;
      const res = await fetch(`${API_BASE}/api/chat-admin?action=messages&threadId=${encodeURIComponent(activeThreadId)}`, {
        headers: { "x-admin-password": adminPassword }
      });
      if (!res.ok) return;
      const data = await res.json();
      const box = document.getElementById("chat-messages");
      box.innerHTML = "";
      (data.messages || []).forEach(m => {
        const row = document.createElement("div");
        row.className = "msg-row " + m.sender;
        const bubble = document.createElement("div");
        bubble.className = "msg " + m.sender;
        if (m.attachment_url) {
          const img = document.createElement("img");
          img.className = "msg-img";
          img.src = m.attachment_url;
          img.alt = "Screenshot";
          img.addEventListener("click", () => window.open(m.attachment_url, "_blank"));
          bubble.appendChild(img);
          if (m.message) {
            const caption = document.createElement("div");
            caption.style.marginTop = "6px";
            caption.textContent = m.message;
            bubble.appendChild(caption);
          }
        } else {
          bubble.textContent = m.message;
        }
        row.appendChild(bubble);
        if (m.sender === "bot") {
          const tag = document.createElement("div");
          tag.className = "msg-tag";
          tag.textContent = "Auto-reply";
          row.appendChild(tag);
        }
        const time = document.createElement("div");
        time.className = "msg-time";
        time.textContent = fmtTime(m.created_at);
        row.appendChild(time);
        box.appendChild(row);
        lastMessageAt = m.created_at;
      });
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById("reply-attach").addEventListener("click", () => {
      if (!activeThreadId) return;
      document.getElementById("reply-file").click();
    });

    document.getElementById("reply-file").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file || !activeThreadId) return;

      const allowed = ["image/png", "image/jpeg", "image/webp", "image/gif"];
      if (!allowed.includes(file.type)) {
        alert("Only PNG, JPEG, WEBP or GIF screenshots are supported.");
        return;
      }
      if (file.size > 4 * 1024 * 1024) {
        alert("That image is too large (max 4MB).");
        return;
      }

      const attachBtn = document.getElementById("reply-attach");
      attachBtn.disabled = true;
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const dataBase64 = dataUrl.split(",")[1] || "";
        await fetch(`${API_BASE}/api/chat-upload`, {
          method: "POST", headers: authHeaders(),
          body: JSON.stringify({ threadId: activeThreadId, fileName: file.name, mimeType: file.type, dataBase64 })
        });
        loadMessages();
      } catch (err) {
        alert("Sorry, that screenshot couldn't be sent. Please try again.");
      } finally {
        attachBtn.disabled = false;
      }
    });

    document.getElementById("reply-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("reply-input");
      const sendBtn = document.getElementById("reply-send");
      const text = input.value.trim();
      if (!text || !activeThreadId || sendBtn.disabled) return;
      input.value = "";
      sendBtn.disabled = true;
      try {
        await fetch(`${API_BASE}/api/chat-admin?action=reply`, {
          method: "POST", headers: authHeaders(), body: JSON.stringify({ threadId: activeThreadId, message: text })
        });
        loadMessages();
      } finally {
        sendBtn.disabled = false;
      }
    });

    if (adminPassword) {
      tryLogin(adminPassword).then(ok => { if (ok) showApp(); });
    }
  </script>
</body>
</html>
